name: jeebz_bag_design_app
description: "AI Bag Design - Create custom bag designs with AI"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  get: ^4.6.6
  flutter_screenutil: ^5.9.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10
  socket_io_client: ^2.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.0
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.0
  fluttertoast: ^8.2.4
  device_preview: ^1.1.0
  loading_animation_widget: ^1.3.0

  animated_text_kit: ^4.2.2
  http: ^1.2.0
  toastification: ^3.0.3
  lottie: ^3.3.2
  visibility_detector: ^0.4.0+2
  carousel_slider: ^5.0.0
  photo_view: ^0.15.0
  awesome_dialog: ^3.3.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3
  flutter_lints: ^6.0.0
  image: ^4.2.0



flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/lOGOss_original.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  # Solid color background for better logo visibility
  background_image: "assets/images/main_background.png"

  # Splash screen logo - using lOGOsss.png
  image: "assets/images/lOGOsss.png"

  # Android specific settings
  android: true
  android_12:
    image: "assets/images/lOGOsss.png"
    color: "#EBFCFF"
    icon_background_color: "#EBFCFF"

  # iOS specific settings
  ios: true
  
  # Web specific settings (optional)
  web: false
  
  # Fullscreen mode
  fullscreen: true
  
  # Android gravity
  android_gravity: center
  
  # iOS content mode
  ios_content_mode: center

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
